<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bouncy Ball</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: system-ui, sans-serif;
      color: #e8e8e8;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 0.75rem;
      letter-spacing: 0.02em;
    }
    canvas {
      display: block;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      background: radial-gradient(ellipse 80% 50% at 50% 100%, #2d4a6e 0%, #1e3a5f 40%, #152238 100%);
    }
    p {
      margin: 0.75rem 0 0;
      font-size: 0.875rem;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <h1>Bouncy ball</h1>
  <canvas id="game" width="560" height="420"></canvas>
  <p>Press <kbd>Space</kbd> to jump — press again anytime for another bounce.</p>

  <script>
    (function () {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");

      const W = canvas.width;
      const H = canvas.height;
      const r = 18;
      const floorY = H - 24;
      const gravity = 0.45;
      const bounce = 0.82;
      const jumpVy = -11;

      let x = W / 2;
      let y = floorY - r - 1;
      let vx = 2.2;
      let vy = 0;

      function drawBall() {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        const g = ctx.createRadialGradient(
          x - r * 0.35, y - r * 0.35, r * 0.1,
          x, y, r
        );
        g.addColorStop(0, "#ff8c42");
        g.addColorStop(0.5, "#e85d04");
        g.addColorStop(1, "#9d0208");
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function drawFloor() {
        ctx.fillStyle = "#0d1821";
        ctx.fillRect(0, floorY, W, H - floorY);
        ctx.strokeStyle = "rgba(100, 180, 255, 0.35)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, floorY);
        ctx.lineTo(W, floorY);
        ctx.stroke();
      }

      function tick() {
        if (!(y + r >= floorY && vy === 0)) vy += gravity;
        x += vx;
        y += vy;

        if (x + r > W) {
          x = W - r;
          vx *= -1;
        } else if (x - r < 0) {
          x = r;
          vx *= -1;
        }

        if (y + r > floorY) {
          y = floorY - r;
          if (vy > 0) {
            vy *= -bounce;
            if (Math.abs(vy) < 0.65) vy = 0;
          }
        }

        ctx.clearRect(0, 0, W, H);
        drawFloor();
        drawBall();

        requestAnimationFrame(tick);
      }

      window.addEventListener("keydown", function (e) {
        if (e.code !== "Space" && e.key !== " ") return;
        if (e.repeat) return;
        e.preventDefault();
        vy = jumpVy;
      });

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
