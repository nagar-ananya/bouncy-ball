<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bouncy Ball</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: system-ui, sans-serif;
      color: #e8e8e8;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.5rem 1.5rem;
      margin: 0 0 0.75rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.02em;
    }
    label {
      font-size: 0.875rem;
    }
    select {
      margin-left: 0.4rem;
      padding: 0.25rem 0.5rem;
      font: inherit;
      color: #e8e8e8;
      background: #0d1821;
      border: 1px solid rgba(100, 180, 255, 0.35);
      border-radius: 6px;
      color-scheme: dark;
    }
    select:disabled {
      opacity: 0.5;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 8rem);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      background: radial-gradient(ellipse 80% 50% at 50% 100%, #2d4a6e 0%, #1e3a5f 40%, #152238 100%);
    }
    p {
      margin: 0.75rem 0 0;
      font-size: 0.875rem;
      opacity: 0.85;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bouncy ball</h1>
    <label>Level
      <select id="level" autocomplete="off">
        <option value="1">1 (slowest)</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4</option>
        <option value="5">5 (fastest)</option>
      </select>
    </label>
  </header>
  <canvas id="game" width="960" height="640"></canvas>
  <p>Pick a level, press <kbd>Enter</kbd> to start, then <kbd>Space</kbd> to bounce the ball in the air — touching the ground or the ceiling ends the game.</p>

  <script>
    (function () {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const levelSelect = document.getElementById("level");

      const W = canvas.width;
      const H = canvas.height;
      const r = 18;
      const ceilingY = 24;
      const floorY = H - 24;
      const gravity = 0.45;
      const bounce = 0.82;
      const jumpVy = -11;
      // How fast the game runs at each level, relative to level 1. Jump height
      // stays the same; everything just happens faster.
      const levelSpeeds = [1, 1.25, 1.5, 1.75, 2];

      let x = W / 2;
      let y = floorY - r - 1;
      let vx = 2.2;
      let vy = 0;

      // "ready" before the first game, "playing" during a game,
      // "over" once the ball has touched the ground or the ceiling.
      let state = "ready";
      let bounces = 0;
      let lastScore = 0;
      let lastLevel = 0;

      function startGame() {
        x = W / 2;
        y = H / 2;
        vy = jumpVy;
        bounces = 0;
        state = "playing";
        levelSelect.disabled = true;
      }

      function endGame() {
        lastScore = bounces;
        lastLevel = levelSelect.value;
        bounces = 0;
        state = "over";
        levelSelect.disabled = false;
      }

      function drawBall() {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        const g = ctx.createRadialGradient(
          x - r * 0.35, y - r * 0.35, r * 0.1,
          x, y, r
        );
        g.addColorStop(0, "#ff8c42");
        g.addColorStop(0.5, "#e85d04");
        g.addColorStop(1, "#9d0208");
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function drawWall(top, height, edgeY) {
        ctx.fillStyle = "#0d1821";
        ctx.fillRect(0, top, W, height);
        ctx.strokeStyle = "rgba(100, 180, 255, 0.35)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, edgeY);
        ctx.lineTo(W, edgeY);
        ctx.stroke();
      }

      function drawCounter() {
        ctx.fillStyle = "#e8e8e8";
        ctx.font = "600 24px system-ui, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText("Bounces: " + bounces, 20, ceilingY + 16);
      }

      function drawMessage(title, lines) {
        ctx.fillStyle = "rgba(8, 14, 26, 0.55)";
        ctx.fillRect(0, ceilingY, W, floorY - ceilingY);
        ctx.fillStyle = "#e8e8e8";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "700 44px system-ui, sans-serif";
        ctx.fillText(title, W / 2, H / 2 - 40);
        ctx.font = "400 22px system-ui, sans-serif";
        lines.forEach(function (line, i) {
          ctx.fillText(line, W / 2, H / 2 + 12 + i * 32);
        });
      }

      function tick() {
        const dt = levelSpeeds[Number(levelSelect.value) - 1];
        if (!(y + r >= floorY && vy === 0)) vy += gravity * dt;
        x += vx * dt;
        y += vy * dt;

        if (x + r > W) {
          x = W - r;
          vx *= -1;
        } else if (x - r < 0) {
          x = r;
          vx *= -1;
        }

        if (y - r < ceilingY) {
          y = ceilingY + r;
          if (vy < 0) vy = 0;
          if (state === "playing") endGame();
        }

        if (y + r > floorY) {
          y = floorY - r;
          if (vy > 0) {
            vy *= -bounce;
            if (Math.abs(vy) < 0.65) vy = 0;
          }
          if (state === "playing") endGame();
        }

        ctx.clearRect(0, 0, W, H);
        drawWall(0, ceilingY, ceilingY);
        drawWall(floorY, H - floorY, floorY);
        drawBall();

        if (state === "ready") {
          drawMessage("Press Enter to start", [
            "Press Space to bounce the ball in the air.",
            "Don't let it touch the ground or the ceiling!"
          ]);
        } else if (state === "over") {
          drawMessage("Game over", [
            "You bounced the ball " + lastScore + (lastScore === 1 ? " time" : " times") +
              " on level " + lastLevel + ".",
            "Press Enter to restart."
          ]);
        }
        drawCounter();

        requestAnimationFrame(tick);
      }

      window.addEventListener("keydown", function (e) {
        const isEnter = e.key === "Enter";
        const isSpace = e.code === "Space" || e.key === " ";
        if (!isEnter && !isSpace) return;
        // Let Space open the level dropdown when it has keyboard focus.
        if (isSpace && e.target === levelSelect) return;
        e.preventDefault();
        if (e.repeat) return;

        if (isEnter) {
          if (state !== "playing") startGame();
        } else if (state === "playing") {
          vy = jumpVy;
          bounces++;
        }
      });

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
